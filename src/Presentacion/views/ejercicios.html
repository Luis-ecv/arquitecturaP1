<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Training - Gestión de Ejercicios</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --dark: #2d3436;
            --light: #dfe6e9;
            --white: #ffffff;
            --danger: #d63031;
            --success: #00b894;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f6fa;
            color: var(--dark);
        }

        /* Navbar */
        .navbar {
            background-color: var(--dark);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .navbar a {
            color: var(--white);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .navbar a:hover, .navbar a.active {
            background-color: var(--primary);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex: 1 1 300px;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s, background 0.3s;
        }

        .btn:hover { background: #5b4bc4; transform: translateY(-2px); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--light);
            vertical-align: middle;
        }

        th { background-color: var(--light); color: var(--dark); }

        tr:hover { background-color: #f1f2f6; }

        .img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        /* Estilos Kebab Menu */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; font-size: 1.5em; cursor: pointer; padding: 0 10px; font-weight: bold; color: var(--dark); }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: var(--white); min-width: 120px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1); z-index: 10; border-radius: 6px; overflow: hidden; border: 1px solid var(--light); }
        .dropdown-content button { color: var(--dark); padding: 12px 16px; text-decoration: none; display: block; background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-size: 0.9em; font-weight: bold; }
        .dropdown-content button:hover { background-color: var(--light); }
        .dropdown-content form { margin: 0; }
        .dropdown-content .danger-text { color: var(--danger); }
        .dropdown:hover .dropdown-content { display: block; }
        .action-cell { width: 50px; text-align: center; }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: {{DISPLAY_MENSAJE}};
        }

        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .preview-box {
            margin-top: 10px;
            width: 100%;
            height: 150px;
            border: 2px dashed #ccc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        @media (min-width: 768px) {
            .table-container { flex: 2 1 600px; }
            .form-container { flex: 1 1 350px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/clientes">Clientes</a>
        <a href="/dietas">Dietas</a>
        <a href="/ejercicios" class="active">Ejercicios</a>
        <a href="/rutinas">Rutinas</a>
        <a href="/asignaciones">Asignaciones</a>
        <a href="/envios">Enviar Rutina</a>
    </nav>

    <header>
        <h1>Personal Training</h1>
        <p>Gestión de Ejercicios</p>
    </header>

    <div class="container">
        <div class="card form-container">
            <h2>Registrar Ejercicio</h2>
            <div class="message {{TIPO_MENSAJE}}">{{MENSAJE}}</div>
            <form action="/ejercicios" method="POST">
                <input type="hidden" name="action" id="form_action" value="crear">
                <input type="hidden" name="ejercicio_id" id="ejercicio_id" value="">
                
                <div class="form-group">
                    <label for="nombre">Nombre del Ejercicio</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Press de Banca">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="repeticion">Series y Reps</label>
                        <input type="text" id="repeticion" name="repeticion" required placeholder="Ej: 4 x 12">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="duracion">Duración/Descanso</label>
                        <input type="text" id="duracion" name="duracion" required placeholder="Ej: 60s">
                    </div>
                </div>

                <div class="form-group">
                    <label for="foto_upload">Subir Imagen del Ejercicio (Opcional, solo JPG/PNG)</label>
                    <input type="file" id="foto_upload" accept="image/png, image/jpeg, image/jpg">
                    <input type="hidden" id="imagen_url" name="imagen_url">
                    <div class="preview-box">
                        <span id="preview_text">Vista previa</span>
                        <img id="preview_img" src="" alt="Vista previa">
                    </div>
                </div>

                <button type="submit" id="btn_submit" class="btn">GUARDAR EJERCICIO</button>
            </form>
        </div>

        <div class="card table-container">
            <h2>Lista de Ejercicios</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Repeticiones</th>
                            <th>Descanso</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{EJERCICIOS_TABLE_BODY}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // Script para convertir la imagen seleccionada a Base64
        const fotoUpload = document.getElementById('foto_upload');
        const imagenUrlHidden = document.getElementById('imagen_url');
        const previewImg = document.getElementById('preview_img');
        const previewText = document.getElementById('preview_text');

        fotoUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.type !== 'image/png' && file.type !== 'image/jpeg') {
                    alert("Solo se permiten imágenes JPG y PNG para asegurar compatibilidad con el PDF.");
                    fotoUpload.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64String = e.target.result;
                    imagenUrlHidden.value = base64String;
                    
                    previewImg.src = base64String;
                    previewImg.style.display = 'block';
                    previewText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                imagenUrlHidden.value = '';
                previewImg.style.display = 'none';
                previewText.style.display = 'inline';
            }
        });

        function editarEjercicio(id, nombre, repeticion, duracion, imagenUrl) {
            document.getElementById('form_action').value = 'editar';
            document.getElementById('ejercicio_id').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('repeticion').value = repeticion;
            document.getElementById('duracion').value = duracion;
            
            document.getElementById('btn_submit').innerText = 'ACTUALIZAR EJERCICIO';
            
            if(imagenUrl && imagenUrl.startsWith('data:image')) {
                imagenUrlHidden.value = imagenUrl;
                previewImg.src = imagenUrl;
                previewImg.style.display = 'block';
                previewText.style.display = 'none';
            } else {
                imagenUrlHidden.value = '';
                previewImg.style.display = 'none';
                previewText.style.display = 'inline';
            }
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
