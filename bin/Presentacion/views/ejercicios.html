<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Training - Gestión de Ejercicios</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="/clientes">Clientes</a>
        <a href="/dietas">Dietas</a>
        <a href="/ejercicios" class="active">Ejercicios</a>
        <a href="/rutinas">Rutinas</a>
        <a href="/asignaciones">Asignaciones</a>
        <a href="/envios">Enviar Rutina</a>
    </nav>

    <header>
        <h1>Personal Training</h1>
        <p>Gestión de Ejercicios</p>
    </header>

    <div class="container">
        <div class="card form-container">
            <h2>Registrar Ejercicio</h2>
            <div class="message {{TIPO_MENSAJE}}" style="display: {{DISPLAY_MENSAJE}};">{{MENSAJE}}</div>
            <form action="/ejercicios" method="POST" enctype="multipart/form-data" id="ejercicioForm">
                <input type="hidden" name="action" id="form_action" value="crear">
                <input type="hidden" name="ejercicio_id" id="ejercicio_id" value="">
                
                <div class="form-group">
                    <label for="nombre">Nombre del Ejercicio</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Press de Banca">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="repeticion">Series y Reps</label>
                        <input type="text" id="repeticion" name="repeticion" required placeholder="Ej: 4 x 12">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="duracion">Duración/Descanso</label>
                        <input type="text" id="duracion" name="duracion" required placeholder="Ej: 60s">
                    </div>
                </div>

                <div class="form-group">
                    <label for="foto_upload">Subir Imagen del Ejercicio (Opcional, solo JPG/PNG)</label>
                    <input type="file" id="foto_upload" accept="image/png, image/jpeg, image/jpg">
                    <input type="hidden" id="imagen_url" name="imagen_url">
                    <div class="preview-box">
                        <span id="preview_text">Vista previa</span>
                        <img id="preview_img" src="" alt="Vista previa">
                    </div>
                </div>

                <button type="submit" id="btn_submit" class="btn">GUARDAR EJERCICIO</button>
            </form>
        </div>

        <div class="card table-container">
            <h2>Lista de Ejercicios</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Repeticiones</th>
                            <th>Descanso</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{EJERCICIOS_TABLE_BODY}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // Script para convertir la imagen seleccionada a Base64
        const fotoUpload = document.getElementById('foto_upload');
        const imagenUrlHidden = document.getElementById('imagen_url');
        const previewImg = document.getElementById('preview_img');
        const previewText = document.getElementById('preview_text');

        fotoUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.type !== 'image/png' && file.type !== 'image/jpeg') {
                    alert("Solo se permiten imágenes JPG y PNG para asegurar compatibilidad con el PDF.");
                    fotoUpload.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64String = e.target.result;
                    imagenUrlHidden.value = base64String;
                    
                    previewImg.src = base64String;
                    previewImg.style.display = 'block';
                    previewText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                imagenUrlHidden.value = '';
                previewImg.style.display = 'none';
                previewText.style.display = 'inline';
            }
        });

        function editarEjercicio(id, nombre, repeticion, duracion, imagenUrl) {
            document.getElementById('form_action').value = 'editar';
            document.getElementById('ejercicio_id').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('repeticion').value = repeticion;
            document.getElementById('duracion').value = duracion;
            
            document.getElementById('btn_submit').innerText = 'ACTUALIZAR EJERCICIO';
            
            if(imagenUrl && imagenUrl.startsWith('data:image')) {
                imagenUrlHidden.value = imagenUrl;
                previewImg.src = imagenUrl;
                previewImg.style.display = 'block';
                previewText.style.display = 'none';
            } else {
                imagenUrlHidden.value = '';
                previewImg.style.display = 'none';
                previewText.style.display = 'inline';
            }
            window.scrollTo(0, 0);
        }

        // Dropdown menu logic
        function toggleDropdown(event) {
            closeAllDropdowns();
            event.stopPropagation();
            const dropdownContent = event.target.nextElementSibling;
            dropdownContent.classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                closeAllDropdowns();
            }
        }

        function closeAllDropdowns() {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
