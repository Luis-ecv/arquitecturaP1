<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Training - Gestión de Rutinas</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="/clientes">Clientes</a>
        <a href="/dietas">Dietas</a>
        <a href="/ejercicios">Ejercicios</a>
        <a href="/rutinas" class="active">Rutinas</a>
        <a href="/asignaciones">Asignaciones</a>
        <a href="/envios">Enviar Rutina</a>
    </nav>

    <header>
        <h1>Personal Training</h1>
        <p>Gestión de Rutinas</p>
    </header>

    <div class="container">
        <div class="card form-container">
            <h2>Registrar Rutina</h2>
            <div class="message {{TIPO_MENSAJE}}" style="display: {{DISPLAY_MENSAJE}};">{{MENSAJE}}</div>
            <form action="/rutinas" method="POST">
                <input type="hidden" name="action" id="form_action" value="crear">
                <input type="hidden" name="rutina_id" id="rutina_id" value="">
                
                <div class="form-group">
                    <label for="cliente_id">Seleccionar Cliente</label>
                    <select id="cliente_id" name="cliente_id" required>
                        <option value="">Seleccione un cliente...</option>
                        {{CLIENTES_OPTIONS}}
                    </select>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre de la Rutina</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Rutina Volumen Semanal">
                </div>
                
                <div class="form-group">
                    <label for="tipo">Tipo de Rutina</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Seleccione...</option>
                        <option value="Hipertrofia">Hipertrofia</option>
                        <option value="Definición">Definición</option>
                        <option value="Fuerza">Fuerza</option>
                        <option value="Resistencia">Resistencia</option>
                        <option value="Cardio">Cardio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dieta_id">Seleccionar Dieta</label>
                    <select id="dieta_id" name="dieta_id" required>
                        <option value="">Seleccione una dieta...</option>
                        {{DIETAS_OPTIONS}}
                    </select>
                </div>

                <button type="submit" id="btn_submit" class="btn">CREAR RUTINA</button>
            </form>
        </div>

        <div class="card table-container">
            <h2>Lista de Rutinas Asignadas</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Nombre de Rutina</th>
                            <th>Tipo</th>
                            <th>Dieta Base</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{RUTINAS_TABLE_BODY}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        function editarRutina(id, nombre, tipo, clienteId, dietaId) {
            document.getElementById('form_action').value = 'editar';
            document.getElementById('rutina_id').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('tipo').value = tipo;
            document.getElementById('cliente_id').value = clienteId;
            document.getElementById('dieta_id').value = dietaId;
            
            document.getElementById('btn_submit').innerText = 'ACTUALIZAR RUTINA';
            window.scrollTo(0, 0);
        }

        // Dropdown menu logic
        function toggleDropdown(event) {
            closeAllDropdowns();
            event.stopPropagation();
            const dropdownContent = event.target.nextElementSibling;
            dropdownContent.classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                closeAllDropdowns();
            }
        }

        function closeAllDropdowns() {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
