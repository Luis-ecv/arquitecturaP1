<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Training - Gestión de Clientes</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --dark: #2d3436;
            --light: #dfe6e9;
            --white: #ffffff;
            --danger: #d63031;
            --success: #00b894;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f6fa;
            color: var(--dark);
        }

        /* Navbar CSS */
        .navbar {
            background-color: var(--dark);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .navbar a {
            color: var(--white);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .navbar a:hover, .navbar a.active {
            background-color: var(--primary);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex: 1 1 300px;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s, background 0.3s;
        }

        .btn:hover {
            background: #5b4bc4;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--light);
        }

        th {
            background-color: var(--light);
            color: var(--dark);
        }

        tr:hover {
            background-color: #f1f2f6;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: {{DISPLAY_MENSAJE}};
        }

        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (min-width: 768px) {
            .table-container { flex: 2 1 600px; }
            .form-container { flex: 1 1 350px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/clientes" class="active">Clientes</a>
        <a href="/dietas">Dietas</a>
        <a href="/ejercicios">Ejercicios</a>
        <a href="/rutinas">Rutinas</a>
        <a href="/asignaciones">Asignaciones</a>
        <a href="/envios">Enviar Rutina</a>
    </nav>

    <header>
        <h1>Personal Training</h1>
        <p>Gestión de Clientes</p>
    </header>

    <div class="container">
        <div class="card form-container">
            <h2>Registrar Cliente</h2>
            <div class="message {{TIPO_MENSAJE}}">{{MENSAJE}}</div>
            <form action="/clientes" method="POST">
                <input type="hidden" name="action" value="crear">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Jorge Ballivian">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" step="0.1" id="peso" name="peso" required placeholder="Ej: 75.5">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="altura">Altura (m)</label>
                        <input type="number" step="0.01" id="altura" name="altura" required placeholder="Ej: 1.75">
                    </div>
                </div>
                <div class="form-group">
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Seleccione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp</label>
                    <input type="text" id="telefono" name="telefono" required placeholder="Ej: +591...">
                </div>
                <button type="submit" class="btn">GUARDAR CLIENTE</button>
            </form>
        </div>

        <div class="card table-container">
            <h2>Lista de Clientes</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>Sexo</th>
                            <th>Contacto</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{CLIENTES_TABLE_BODY}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
