<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Training - Gestión de Clientes</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/clientes" class="active">Clientes</a>
        <a href="/dietas">Dietas</a>
        <a href="/ejercicios">Ejercicios</a>
        <a href="/rutinas">Rutinas</a>
        <a href="/asignaciones">Asignaciones</a>
        <a href="/envios">Enviar Rutina</a>
    </nav>

    <header>
        <h1>Personal Training</h1>
        <p>Gestión de Clientes</p>
    </header>

    <div class="container">
        <div class="card form-container">
            <h2>Registrar Cliente</h2>
            <div class="message {{TIPO_MENSAJE}}" style="display: {{DISPLAY_MENSAJE}};">{{MENSAJE}}</div>
            <form action="/clientes" method="POST">
                <input type="hidden" name="action" id="form_action" value="crear">
                <input type="hidden" name="cliente_id" id="cliente_id" value="">
                
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Jorge Ballivian">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" step="0.1" id="peso" name="peso" required placeholder="Ej: 75.5">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="altura">Altura (m)</label>
                        <input type="number" step="0.01" id="altura" name="altura" required placeholder="Ej: 1.75">
                    </div>
                </div>
                <div class="form-group">
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Seleccione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp</label>
                    <input type="text" id="telefono" name="telefono" required placeholder="Ej: +591...">
                </div>

                <button type="submit" id="btn_submit" class="btn">GUARDAR CLIENTE</button>
            </form>
        </div>

        <div class="card table-container">
            <h2>Lista de Clientes</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Peso</th>
                            <th>Altura</th>
                            <th>Sexo</th>
                            <th>Contacto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{CLIENTES_TABLE_BODY}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        function editarCliente(id, nombre, peso, altura, sexo, correo, telefono) {
            document.getElementById('form_action').value = 'editar';
            document.getElementById('cliente_id').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('peso').value = peso;
            document.getElementById('altura').value = altura;
            document.getElementById('sexo').value = sexo;
            document.getElementById('correo').value = correo;
            document.getElementById('telefono').value = telefono;
            
            document.getElementById('btn_submit').innerText = 'ACTUALIZAR CLIENTE';
            window.scrollTo(0, 0);
        }

        // Dropdown menu logic
        function toggleDropdown(event) {
            closeAllDropdowns();
            event.stopPropagation();
            const dropdownContent = event.target.nextElementSibling;
            dropdownContent.classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                closeAllDropdowns();
            }
        }

        function closeAllDropdowns() {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
