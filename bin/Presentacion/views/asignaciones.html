<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Training - Asignaciones</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --dark: #2d3436;
            --light: #dfe6e9;
            --white: #ffffff;
            --danger: #d63031;
            --success: #00b894;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f6fa;
            color: var(--dark);
        }

        /* Navbar CSS */
        .navbar {
            background-color: var(--dark);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .navbar a {
            color: var(--white);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .navbar a:hover, .navbar a.active {
            background-color: var(--primary);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex: 1 1 300px;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s, background 0.3s;
        }

        .btn:hover {
            background: #5b4bc4;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--light);
            vertical-align: middle;
        }

        th {
            background-color: var(--light);
            color: var(--dark);
        }

        tr:hover {
            background-color: #f1f2f6;
        }

        /* Estilos Kebab Menu */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; font-size: 1.5em; cursor: pointer; padding: 0 10px; font-weight: bold; color: var(--dark); }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: var(--white); min-width: 120px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1); z-index: 10; border-radius: 6px; overflow: hidden; border: 1px solid var(--light); }
        .dropdown-content button { color: var(--dark); padding: 12px 16px; text-decoration: none; display: block; background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-size: 0.9em; font-weight: bold; }
        .dropdown-content button:hover { background-color: var(--light); }
        .dropdown-content form { margin: 0; }
        .dropdown-content .danger-text { color: var(--danger); }
        .dropdown:hover .dropdown-content { display: block; }
        .action-cell { width: 50px; text-align: center; }

        .img-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: {{DISPLAY_MENSAJE}};
        }

        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            font-size: 0.9em;
        }

        .checkbox-label input {
            width: auto;
            margin-right: 8px;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .btn-danger:hover {
            background-color: #b32424;
        }

        @media (min-width: 768px) {
            .table-container { flex: 2 1 600px; }
            .form-container { flex: 1 1 350px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/clientes">Clientes</a>
        <a href="/dietas">Dietas</a>
        <a href="/ejercicios">Ejercicios</a>
        <a href="/rutinas">Rutinas</a>
        <a href="/asignaciones" class="active">Asignaciones</a>
        <a href="/envios">Enviar Rutina</a>
    </nav>

    <header>
        <h1>Personal Training</h1>
        <p>Asociar Ejercicios a Rutina</p>
    </header>

    <div class="container">
        <div class="card form-container">
            <h2>Asignar Ejercicio</h2>
            <div class="message {{TIPO_MENSAJE}}">{{MENSAJE}}</div>
            <form action="/asignaciones" method="POST">
                <input type="hidden" name="action" value="crear">
                
                <div class="form-group">
                    <label for="rutina_id">Seleccionar Rutina</label>
                    <select id="rutina_id" name="rutina_id" required>
                        <option value="">Seleccione una rutina...</option>
                        {{RUTINAS_OPTIONS}}
                    </select>
                </div>

                <div class="form-group">
                    <label>Días de la Rutina (Selecciona varios)</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="dia_Lunes" value="Lunes"> Lunes</label>
                        <label class="checkbox-label"><input type="checkbox" name="dia_Martes" value="Martes"> Martes</label>
                        <label class="checkbox-label"><input type="checkbox" name="dia_Miércoles" value="Miércoles"> Miércoles</label>
                        <label class="checkbox-label"><input type="checkbox" name="dia_Jueves" value="Jueves"> Jueves</label>
                        <label class="checkbox-label"><input type="checkbox" name="dia_Viernes" value="Viernes"> Viernes</label>
                        <label class="checkbox-label"><input type="checkbox" name="dia_Sábado" value="Sábado"> Sábado</label>
                        <label class="checkbox-label"><input type="checkbox" name="dia_Domingo" value="Domingo"> Domingo</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ejercicio_id">Añadir Ejercicio</label>
                    <select id="ejercicio_id" name="ejercicio_id" required>
                        <option value="">Seleccione un ejercicio...</option>
                        {{EJERCICIOS_OPTIONS}}
                    </select>
                </div>

                <button type="submit" class="btn">ASIGNAR A RUTINA</button>
            </form>
        </div>

        <div class="card table-container">
            <h2>Ejercicios por Rutina</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Rutina (Cliente)</th>
                            <th>Día</th>
                            <th></th>
                            <th>Ejercicio</th>
                            <th>Series/Reps</th>
                            <th>Descanso</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ASIGNACIONES_TABLE_BODY}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
